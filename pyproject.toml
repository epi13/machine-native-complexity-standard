[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mncs-validator"
version = "0.3.0rc1"
description = "Offline validators for MNCS evidence and MNCS/MNCDS release-candidate records"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "MNCS Contributors"}]
keywords = ["generated-code", "software-standards", "static-analysis", "machine-native-development"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "cryptography>=43,<47",
  "jsonschema>=4.23,<5",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<3",
  "pytest>=8.3,<10",
  "ruff==0.15.22",
  "mkdocs>=1.6,<2",
  "types-jsonschema>=4.23",
]

[project.scripts]
mncs = "mncs_validator.cli:main"
mncds = "mncs_validator.mncds_cli:main"

[project.urls]
Homepage = "https://github.com/epi13/machine-native-complexity-standard"
Documentation = "https://epi13.github.io/machine-native-complexity-standard/"
Repository = "https://github.com/epi13/machine-native-complexity-standard"
Issues = "https://github.com/epi13/machine-native-complexity-standard/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mncs_validator.resources.schemas" = ["*.json"]

[tool.setuptools.data-files]
"share/mncs-validator/conformance/release-candidate" = [
  "conformance/release-candidate/corpus.json",
  "conformance/release-candidate/suite-index.json",
]
"share/mncs-validator/examples/release-candidate-0.3" = [
  "examples/release-candidate-0.3/contract-profile.json",
  "examples/release-candidate-0.3/assurance-case.json",
  "examples/release-candidate-0.3/threat-record.json",
  "examples/release-candidate-0.3/measurement-profile.json",
]
"share/mncs-validator/examples/mncds-0.1-rc" = [
  "examples/mncds-0.1-rc/development-record.json",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "conformance-corpus",
  "examples",
  "case-studies/dsense-desk-pet",
  "case-studies/composed-gateway/tools_generate.py",
  "case-studies/composed-gateway/wave-three",
  "case-studies/composed-gateway/wave-five/bundle-src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mncs_validator", "mncs_provider_sdk"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
