name: Protected Remote Water Evaluation

on:
  workflow_dispatch:
    inputs:
      evaluation_epoch:
        description: Frozen evaluation epoch identifier
        required: true
        default: remote-water-protected-epoch-1

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8

jobs:
  freeze-evaluator:
    runs-on: ubuntu-24.04
    environment: protected-evaluation
    outputs:
      commit_sha: ${{ steps.freeze.outputs.commit_sha }}
      evaluator_sha: ${{ steps.freeze.outputs.evaluator_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: freeze
        shell: bash
        run: |
          set -euo pipefail
          evaluator="case-studies/remote-water-control/tools/run_study.py"
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "evaluator_sha=sha256:$(sha256sum "$evaluator" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf '{"evaluation_epoch":"%s","commit_sha":"%s","evaluator_sha":"sha256:%s"}\n' \
            '${{ inputs.evaluation_epoch }}' "$GITHUB_SHA" "$(sha256sum "$evaluator" | cut -d' ' -f1)" \
            > frozen-evaluator.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: frozen-remote-water-evaluator-${{ github.sha }}
          path: frozen-evaluator.json
          if-no-files-found: error
          retention-days: 90

  evaluate:
    needs: freeze-evaluator
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    environment: protected-evaluation
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.freeze-evaluator.outputs.commit_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify frozen evaluator
        shell: bash
        run: |
          set -euo pipefail
          observed="sha256:$(sha256sum case-studies/remote-water-control/tools/run_study.py | cut -d' ' -f1)"
          test "$observed" = '${{ needs.freeze-evaluator.outputs.evaluator_sha }}'
      - name: Run bound evaluation
        run: make remote-water-study
      - name: Record host identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          payload = {
              "evaluation_epoch": os.environ["EVALUATION_EPOCH"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "declared_architecture": os.environ["DECLARED_ARCHITECTURE"],
              "machine": platform.machine(),
              "platform": platform.platform(),
              "python": platform.python_version(),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_environment": os.environ.get("RUNNER_ENVIRONMENT"),
          }
          Path("host-identity.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
        env:
          EVALUATION_EPOCH: ${{ inputs.evaluation_epoch }}
          DECLARED_ARCHITECTURE: ${{ matrix.architecture }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: protected-remote-water-${{ matrix.architecture }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            host-identity.json
            case-studies/remote-water-control/evidence/results/

  compare-hosts:
    needs: evaluate
    runs-on: ubuntu-24.04
    environment: protected-evaluation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          pattern: protected-remote-water-*-${{ github.sha }}
          path: protected-hosts
      - name: Require matching x86_64 and ARM64 evidence
        run: |
          python case-studies/remote-water-control/tools/compare_cross_host_results.py \
            --input protected-hosts \
            --output cross-host-summary.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: protected-remote-water-cross-host-${{ github.sha }}
          path: cross-host-summary.json
          if-no-files-found: error
          retention-days: 90

  boundary:
    needs: compare-hosts
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Preserve claim boundary
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.compare-hosts.result }}' = 'success'
          echo "Cross-host execution success does not independently establish protected-holdout, MNCS-L5, MNCDS-D3, domain-review, or production-release status."
