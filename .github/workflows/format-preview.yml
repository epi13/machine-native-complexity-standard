name: Format Preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.9,<1"
      - name: Capture formatting diff
        run: |
          ruff format --diff . > ruff-format.diff
          test -s ruff-format.diff || printf 'No formatting changes required.\n' > ruff-format.diff
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-format-preview
          path: ruff-format.diff
