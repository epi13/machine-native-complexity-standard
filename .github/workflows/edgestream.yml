name: EdgeStream

on:
  push:
    paths:
      - "case-studies/edgestream/**"
      - "schemas/**"
      - "src/mncs_validator/**"
      - ".github/workflows/edgestream.yml"
  pull_request:
    paths:
      - "case-studies/edgestream/**"
      - "schemas/**"
      - "src/mncs_validator/**"
      - ".github/workflows/edgestream.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgestream-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: make -C case-studies/edgestream smoke

  thorough:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Capture canonical formatting and lint repair
        shell: bash
        run: |
          ruff format case-studies/edgestream/tools
          set -o pipefail
          ruff check --fix case-studies/edgestream/tools 2>&1 | tee edgestream-ruff.log || true
      - name: Run full controlled study
        shell: bash
        run: |
          set -o pipefail
          make -C case-studies/edgestream thorough 2>&1 | tee edgestream-study.log
      - name: Upload regenerated evidence and repair capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgestream-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            edgestream-ruff.log
            edgestream-study.log
            case-studies/edgestream/tools/*.py
            case-studies/edgestream/evidence/
            case-studies/edgestream/manifest.json
            case-studies/edgestream/mncds/development-record.json
            case-studies/edgestream/workloads/manifest.json
            case-studies/edgestream/machine/edgestream_generated.c
      - name: Verify captured evidence is current
        run: git diff --exit-code -- case-studies/edgestream
