name: EdgeStream

on:
  push:
    paths:
      - "case-studies/edgestream/**"
      - "schemas/**"
      - "src/mncs_validator/**"
      - ".github/workflows/edgestream.yml"
  pull_request:
    paths:
      - "case-studies/edgestream/**"
      - "schemas/**"
      - "src/mncs_validator/**"
      - ".github/workflows/edgestream.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgestream-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8

jobs:
  refresh-captured-evidence:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/strengthen-edgestream-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strengthen-edgestream-evidence
          fetch-depth: 2
      - name: Decide whether capture needs refresh
        id: guard
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "Refresh EdgeStream captured evidence" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.13"
      - if: steps.guard.outputs.run == 'true'
        run: python -m pip install -e '.[dev]'
      - name: Apply final source repair
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("case-studies/edgestream/tools/derive_evidence.py")
          text = path.read_text(encoding="utf-8")
          old = 'extensions["mncs.dev:p99-latency-policy"] = {\n            "observed_ratio": benchmark.get("worst_workload_p99_batch_latency_ratio"),\n            "maximum_allowed_ratio": benchmark.get("maximum_latency_ratio"),\n            "status": ('
          new = 'extensions["mncs.dev:p99-latency-policy"] = {\n            "observed_ratio": benchmark.get("worst_workload_p99_batch_latency_ratio"),\n            "maximum_allowed_ratio": benchmark.get("maximum_latency_ratio"),\n            "policy_result": ('
          if old not in text:
              raise SystemExit("expected p99 policy extension block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Canonicalize evaluator source
        if: steps.guard.outputs.run == 'true'
        run: |
          ruff format case-studies/edgestream/tools
          ruff check --fix --unsafe-fixes case-studies/edgestream/tools
          ruff format --check case-studies/edgestream/tools
          ruff check case-studies/edgestream/tools
      - name: Regenerate and validate captured evidence
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          make -C case-studies/edgestream thorough 2>&1 | tee refresh-study.log
      - name: Upload refresh diagnostics
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: edgestream-refresh-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            refresh-study.log
            case-studies/edgestream/tools/*.py
            case-studies/edgestream/evidence/
            case-studies/edgestream/manifest.json
            case-studies/edgestream/mncds/development-record.json
            case-studies/edgestream/workloads/manifest.json
            case-studies/edgestream/machine/edgestream_generated.c
      - name: Commit refreshed capture
        if: steps.guard.outputs.run == 'true' && success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-studies/edgestream
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh EdgeStream captured evidence"
          git push origin HEAD:agent/strengthen-edgestream-evidence

  smoke:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: make -C case-studies/edgestream smoke

  thorough:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Check evaluator source
        run: |
          ruff format --check case-studies/edgestream/tools
          ruff check case-studies/edgestream/tools
      - name: Run full controlled study
        run: make -C case-studies/edgestream thorough
      - name: Upload regenerated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgestream-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            case-studies/edgestream/evidence/
            case-studies/edgestream/manifest.json
            case-studies/edgestream/mncds/development-record.json
            case-studies/edgestream/workloads/manifest.json
            case-studies/edgestream/machine/edgestream_generated.c
