name: EdgeStream

on:
  push:
    paths:
      - "case-studies/edgestream/**"
      - "schemas/**"
      - "src/mncs_validator/**"
      - ".github/workflows/edgestream.yml"
  pull_request:
    paths:
      - "case-studies/edgestream/**"
      - "schemas/**"
      - "src/mncs_validator/**"
      - ".github/workflows/edgestream.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgestream-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: make -C case-studies/edgestream smoke

  thorough:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Check evaluator source
        run: |
          ruff format --check case-studies/edgestream/tools
          ruff check case-studies/edgestream/tools
      - name: Verify checked-in derived evidence is current
        shell: bash
        run: |
          set -euo pipefail
          python case-studies/edgestream/tools/package_evidence.py
          git diff --check -- case-studies/edgestream
          git diff --exit-code -- \
            case-studies/edgestream/manifest.json \
            case-studies/edgestream/mncds/development-record.json \
            case-studies/edgestream/evidence/index.json \
            case-studies/edgestream/evidence/identities \
            case-studies/edgestream/evidence/results/gate-*.json \
            case-studies/edgestream/evidence/results/invariant-*.json \
            case-studies/edgestream/evidence/results/performance-*.json
      - name: Run full controlled study
        shell: bash
        run: |
          set -o pipefail
          make -C case-studies/edgestream thorough 2>&1 | tee edgestream-thorough.log
      - name: Check generated whitespace
        run: git diff --check -- case-studies/edgestream
      - name: Upload regenerated evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: edgestream-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            edgestream-thorough.log
            case-studies/edgestream/evidence/
            case-studies/edgestream/manifest.json
            case-studies/edgestream/mncds/development-record.json
            case-studies/edgestream/workloads/manifest.json
            case-studies/edgestream/machine/edgestream_generated.c
