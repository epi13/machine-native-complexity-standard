name: EdgeStream

on:
  push:
    paths:
      - "case-studies/edgestream/**"
      - "schemas/**"
      - "src/mncs_validator/**"
      - ".github/workflows/edgestream.yml"
  pull_request:
    paths:
      - "case-studies/edgestream/**"
      - "schemas/**"
      - "src/mncs_validator/**"
      - ".github/workflows/edgestream.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgestream-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8

jobs:
  refresh-captured-evidence:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'agent/strengthen-edgestream-evidence' &&
      !contains(github.event.head_commit.message, 'Refresh EdgeStream captured evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strengthen-edgestream-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Canonicalize evaluator source
        run: |
          ruff format case-studies/edgestream/tools
          ruff check --fix --unsafe-fixes case-studies/edgestream/tools
          ruff format --check case-studies/edgestream/tools
          ruff check case-studies/edgestream/tools
      - name: Regenerate and validate captured evidence
        run: make -C case-studies/edgestream thorough
      - name: Commit refreshed capture
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-studies/edgestream
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh EdgeStream captured evidence"
          git push origin HEAD:agent/strengthen-edgestream-evidence

  smoke:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: make -C case-studies/edgestream smoke

  thorough:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Check evaluator source
        run: |
          ruff format --check case-studies/edgestream/tools
          ruff check case-studies/edgestream/tools
      - name: Run full controlled study
        run: make -C case-studies/edgestream thorough
      - name: Upload regenerated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgestream-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            case-studies/edgestream/evidence/
            case-studies/edgestream/manifest.json
            case-studies/edgestream/mncds/development-record.json
            case-studies/edgestream/workloads/manifest.json
            case-studies/edgestream/machine/edgestream_generated.c
