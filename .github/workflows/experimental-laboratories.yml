name: Experimental Laboratories

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  multilingual-wave-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: python -m pip install -e '.[dev]'
      - run: make multilingual-wave-one
      - run: mncs schema language-evidence-profile >/dev/null
      - run: mncs schema cross-language-comparison >/dev/null

  multilingual-wave-two:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: python -m pip install -e '.[dev]'
      - run: make multilingual-wave-two
      - run: git diff --check

  multilingual-wave-three:
    name: Wave Three (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: python -m pip install -e '.[dev]'
      - run: make multilingual-wave-three WAVE_THREE_OUTPUT=evidence/cross-host-${RUNNER_OS}
      - run: mncs schema composed-evidence-epoch >/dev/null
      - run: git diff --check
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: multilingual-wave-three-${{ runner.os }}
          path: case-studies/composed-gateway/wave-three/evidence/cross-host-${{ runner.os }}
          retention-days: 90

  wave-four-cross-host:
    needs: multilingual-wave-three
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: false
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v8
        with:
          pattern: multilingual-wave-three-*
          path: wave-three-hosts
      - name: Reconcile the two host records
        run: |
          mapfile -t records < <(find wave-three-hosts -type f -name wave-three-epoch.json -print | sort)
          test "${#records[@]}" -eq 2
          PYTHONPATH=src python case-studies/composed-gateway/wave-four/tools/reconcile_cross_host.py \
            "${records[@]}" \
            --output case-studies/composed-gateway/wave-four/evidence/cross-host-agreement.json
      - run: make multilingual-wave-four WAVE_FOUR_OUTPUT=evidence/actual
      - run: git diff --check

  historical-ravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make ravel-test
      - run: make ravel-training-check
      - run: make ravel-unified-check
      - name: Upload preserved mismatch evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ravel-unified-actual
          path: case-studies/ravel/unified-actual.json
          if-no-files-found: ignore

  ravel-0-6-preregistration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: make ravel-0.6-preregistration-check
      - run: git diff --check

  dsense:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make dsense-check
