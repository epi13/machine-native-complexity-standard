name: CacheForge KV Cache Study

on:
  push:
    branches: [main]
    paths:
      - "case-studies/cacheforge/**"
      - "docs/cacheforge.md"
      - "Makefile"
      - "mkdocs.yml"
      - ".github/workflows/cacheforge.yml"
  pull_request:
    paths:
      - "case-studies/cacheforge/**"
      - "docs/cacheforge.md"
      - "Makefile"
      - "mkdocs.yml"
      - ".github/workflows/cacheforge.yml"

permissions:
  contents: read

concurrency:
  group: cacheforge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Produce canonical formatted source and diagnostics
        run: |
          ruff format case-studies/cacheforge
          ruff check --fix case-studies/cacheforge || true
          ruff check --output-format=json case-studies/cacheforge > case-studies/cacheforge/ruff-diagnostics.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cacheforge-canonical-source-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: case-studies/cacheforge/
