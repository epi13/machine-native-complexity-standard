name: CacheForge KV Cache Study

on:
  push:
    branches: [main]
    paths:
      - "case-studies/cacheforge/**"
      - "docs/cacheforge.md"
      - "README.md"
      - "Makefile"
      - "mkdocs.yml"
      - ".github/workflows/cacheforge.yml"
  pull_request:
    paths:
      - "case-studies/cacheforge/**"
      - "docs/cacheforge.md"
      - "README.md"
      - "Makefile"
      - "mkdocs.yml"
      - ".github/workflows/cacheforge.yml"

permissions:
  contents: read

concurrency:
  group: cacheforge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Check CacheForge source
        run: |
          ruff format --check case-studies/cacheforge
          ruff check case-studies/cacheforge
      - name: Run controlled studies
        run: |
          make cacheforge-study
          make cacheforge-epoch2
      - name: Verify regenerated evidence
        run: |
          git diff --check -- case-studies/cacheforge
          git diff --exit-code -- \
            case-studies/cacheforge/machine/generated_policy.py \
            case-studies/cacheforge/evidence/results/study-summary.json \
            case-studies/cacheforge/evidence/results/epoch-2-development.json \
            case-studies/cacheforge/evidence/results/epoch-2-scenario-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cacheforge-evidence-py${{ matrix.python-version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: case-studies/cacheforge/evidence/results/
