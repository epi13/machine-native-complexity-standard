name: Temporary Ruff Apply

on:
  push:
    branches:
      - agent/ravel-recursive-experience-substrate

permissions:
  contents: write

jobs:
  format-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ravel-recursive-experience-substrate
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.15.22
      - run: ruff format studies/recursive-experience-substrate/validate_substrate.py
      - name: Commit exact Ruff formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studies/recursive-experience-substrate/validate_substrate.py
          git commit -m "Apply Ruff formatting to experience validator"
          git push origin HEAD:agent/ravel-recursive-experience-substrate
