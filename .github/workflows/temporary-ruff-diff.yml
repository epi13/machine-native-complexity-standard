name: Temporary Ruff Diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diff:
    if: github.event.pull_request.head.ref == 'agent/ravel-recursive-experience-substrate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.15.22
      - run: ruff format --diff studies/recursive-experience-substrate/validate_substrate.py
