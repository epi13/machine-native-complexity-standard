name: Core Standard

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: python scripts/validate_release_gap_issue_map.py
      - run: python scripts/validate-family-registry.py
      - run: git diff --check

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -m "not experimental"
      - run: python scripts/validate-family-registry.py
      - name: Exercise bootstrap CLI JSON
        run: |
          python -m mncs_validator family --json
          python -m mncs_validator bootstrap --profile core --plan --json --no-network
      - name: Validate packaged schemas
        run: python -c "from mncs_validator.schemas import SCHEMA_NAMES, load_schema; [load_schema(n) for n in SCHEMA_NAMES]"
      - run: ./scripts/run-conformance-corpus
      - run: python scripts/run-mncds-corpus
      - run: ./scripts/verify-examples

  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: python -m pip install -e '.[dev]'
      - run: cargo fmt --manifest-path independent/rc-consumer/Cargo.toml -- --check
      - run: make release-candidate-check
      - run: git diff --check

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: ./scripts/clean-wheel-smoke-test
      - run: git diff --check

  pinned-cross-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e '.[dev]'
      - name: Checkout pinned Rust validator
        env:
          RUST_COMMIT: ${{ vars.MNCS_RS_COMMIT }}
        run: |
          commit="${RUST_COMMIT:-$(cat interoperability/RUST_VALIDATOR_COMMIT)}"
          git clone https://github.com/epi13/mncs-validator-rs "$RUNNER_TEMP/mncs-validator-rs"
          git -C "$RUNNER_TEMP/mncs-validator-rs" checkout "$commit"
      - run: ./scripts/run-interoperability --rust-repository "$RUNNER_TEMP/mncs-validator-rs" --output interoperability-agreement.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: interoperability-agreement
          path: interoperability-agreement.json

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: mkdocs build --strict
      - run: git diff --check
