name: Format Case Study Fix

on:
  push:
    branches:
      - agent/fix-case-study-evidence

permissions:
  contents: write

concurrency:
  group: format-case-study-fix
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-case-study-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Apply canonical formatting
        run: |
          ruff format case-studies/remote-water-control case-studies/edgestream-remote-water-integration
          ruff check --fix case-studies/remote-water-control case-studies/edgestream-remote-water-integration
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-studies/remote-water-control case-studies/edgestream-remote-water-integration
          git commit -m "Format case-study fixes"
          git push origin HEAD:agent/fix-case-study-evidence
