name: EdgeStream Remote Water Integration

on:
  push:
    branches: [main]
    paths:
      - "case-studies/edgestream/**"
      - "case-studies/remote-water-control/**"
      - "case-studies/edgestream-remote-water-integration/**"
      - ".github/workflows/edgestream-remote-water-integration.yml"
      - "Makefile"
  pull_request:
    paths:
      - "case-studies/edgestream/**"
      - "case-studies/remote-water-control/**"
      - "case-studies/edgestream-remote-water-integration/**"
      - ".github/workflows/edgestream-remote-water-integration.yml"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: edgestream-water-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8

jobs:
  integration-study:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Produce canonical source and diagnostics
        shell: bash
        run: |
          mkdir -p diagnostics
          ruff format case-studies/remote-water-control case-studies/edgestream-remote-water-integration \
            > diagnostics/ruff-format.log 2>&1
          set +e
          ruff check --fix case-studies/remote-water-control case-studies/edgestream-remote-water-integration \
            > diagnostics/ruff-check.log 2>&1
          echo "$?" > diagnostics/ruff-check-exit-code.txt
          set -e
      - name: Run isolated component-boundary integration
        run: make edgestream-water-integration
      - name: Require checked-in canonical source
        run: |
          test "$(cat diagnostics/ruff-check-exit-code.txt)" = "0"
          git diff --exit-code -- case-studies/remote-water-control case-studies/edgestream-remote-water-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-study-canonical-py${{ matrix.python-version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            diagnostics/
            case-studies/remote-water-control/
            case-studies/edgestream-remote-water-integration/
