name: Apply Format

on:
  push:
    branches:
      - agent/mncds-evidence-plan-and-decisions

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mncds-evidence-plan-and-decisions
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.9,<1"
      - run: ruff format .
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:agent/mncds-evidence-plan-and-decisions
