name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - name: Validate JSON Schemas
        run: python -c "from mncs_validator.schemas import SCHEMA_NAMES, load_schema; [load_schema(n) for n in SCHEMA_NAMES]"
      - run: ./scripts/run-conformance-corpus
      - run: ./scripts/run-interoperability --python-only
      - run: ./scripts/verify-examples
      - run: python -m build
      - run: git diff --check

  multilingual-wave-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: python -m pip install -e '.[dev]'
      - run: make multilingual-wave-one
      - run: mncs schema language-evidence-profile >/dev/null
      - run: mncs schema cross-language-comparison >/dev/null

  multilingual-wave-two:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v6.2.0
        with:
          go-version: "1.23.x"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: python -m pip install -e '.[dev]'
      - name: Verify schemas and Go provider corpus
        run: PYTHONPATH=src ./scripts/verify-wave-two
      - name: Go gateway unit, race, and fuzz checks
        run: make go-gateway
      - name: Native, generated-binding, process, and rollback checks
        run: make composed-gateway
      - name: Validate packaged schemas
        run: |
          mncs schema boundary-contract >/dev/null
          mncs schema composed-assurance-case >/dev/null
      - name: Check Wave Two tree cleanliness
        run: git diff --check -- case-studies/go-gateway case-studies/composed-gateway experimental/language-evidence docs/composed-systems.md rfcs/0007-composed-machine-native-systems.md

  ravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - run: make ravel-test
      - run: make ravel-training-check
      - run: make ravel-unified-check
      - name: Upload unified mismatch evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ravel-unified-actual
          path: case-studies/ravel/unified-actual.json
          if-no-files-found: ignore

  dsense:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - run: make dsense-check

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: ./scripts/clean-wheel-smoke-test

  cross-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e '.[dev]'
      - name: Checkout pinned Rust validator
        env:
          RUST_COMMIT: ${{ vars.MNCS_RS_COMMIT }}
        run: |
          commit="${RUST_COMMIT:-$(cat interoperability/RUST_VALIDATOR_COMMIT)}"
          git clone https://github.com/epi13/mncs-validator-rs "$RUNNER_TEMP/mncs-validator-rs"
          git -C "$RUNNER_TEMP/mncs-validator-rs" checkout "$commit"
      - run: ./scripts/run-interoperability --rust-repository "$RUNNER_TEMP/mncs-validator-rs" --output interoperability-agreement.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: interoperability-agreement
          path: interoperability-agreement.json
