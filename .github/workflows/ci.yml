name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - name: Validate JSON Schemas
        run: python -c "from mncs_validator.schemas import SCHEMA_NAMES, load_schema; [load_schema(n) for n in SCHEMA_NAMES]"
      - run: ./scripts/run-conformance-corpus
      - run: ./scripts/run-interoperability --python-only
      - run: ./scripts/verify-examples
      - run: python -m build
      - run: git diff --check

  multilingual-wave-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: python -m pip install -e '.[dev]'
      - name: Verify multilingual evidence wave
        run: make multilingual-wave-one
      - name: Validate experimental schemas
        run: |
          mncs schema language-evidence-profile >/dev/null
          mncs schema cross-language-comparison >/dev/null
      - name: Generate cross-language report
        run: >-
          python case-studies/multilingual-stream/tools/run_experiment.py
          --output multilingual-wave-one-report.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: multilingual-wave-one-report
          path: multilingual-wave-one-report.json
      - name: Check multilingual tree cleanliness
        run: git diff --check -- experimental/language-evidence case-studies/multilingual-stream case-studies/cacheforge/python-language-profile-epoch-3.json docs/language-evidence-profiles.md rfcs/0006-experimental-language-evidence-profiles.md

  ravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Validate inference capsule
        run: make ravel-test
      - name: Reproduce recursive training evidence
        run: make ravel-training-check
      - name: Reproduce unified architecture evidence
        run: make ravel-unified-check
      - name: Upload unified mismatch evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ravel-unified-actual
          path: case-studies/ravel/unified-actual.json
          if-no-files-found: ignore
      - name: Check RAVEL tree cleanliness
        run: git diff --check -- case-studies/ravel

  dsense:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - name: Verify dSense Desk Pet case study
        run: make dsense-check
      - name: Check dSense tree cleanliness
        run: git diff --check -- case-studies/dsense-desk-pet

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: ./scripts/clean-wheel-smoke-test

  cross-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e '.[dev]'
      - name: Checkout pinned Rust validator
        env:
          RUST_COMMIT: ${{ vars.MNCS_RS_COMMIT }}
        run: |
          commit="${RUST_COMMIT:-$(cat interoperability/RUST_VALIDATOR_COMMIT)}"
          git clone https://github.com/epi13/mncs-validator-rs "$RUNNER_TEMP/mncs-validator-rs"
          git -C "$RUNNER_TEMP/mncs-validator-rs" checkout "$commit"
      - run: >-
          ./scripts/run-interoperability
          --rust-repository "$RUNNER_TEMP/mncs-validator-rs"
          --output interoperability-agreement.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: interoperability-agreement
          path: interoperability-agreement.json
