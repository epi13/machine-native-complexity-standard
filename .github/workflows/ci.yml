name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - name: Validate JSON Schemas
        run: python -c "from mncs_validator.schemas import SCHEMA_NAMES, load_schema; [load_schema(n) for n in SCHEMA_NAMES]"
      - run: ./scripts/run-conformance-corpus
      - run: ./scripts/run-interoperability --python-only
      - run: ./scripts/verify-examples
      - run: python -m build
      - run: git diff --check

  ravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate inference capsule
        run: make ravel-test
      - name: Reproduce recursive training evidence
        run: make ravel-training-check
      - name: Check RAVEL tree cleanliness
        run: git diff --check -- case-studies/ravel

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: ./scripts/clean-wheel-smoke-test

  cross-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e '.[dev]'
      - name: Checkout pinned Rust validator
        env:
          RUST_COMMIT: ${{ vars.MNCS_RS_COMMIT }}
        run: |
          commit="${RUST_COMMIT:-$(cat interoperability/RUST_VALIDATOR_COMMIT)}"
          git clone https://github.com/epi13/mncs-validator-rs "$RUNNER_TEMP/mncs-validator-rs"
          git -C "$RUNNER_TEMP/mncs-validator-rs" checkout "$commit"
      - run: >-
          ./scripts/run-interoperability
          --rust-repository "$RUNNER_TEMP/mncs-validator-rs"
          --output interoperability-agreement.json
      - uses: actions/upload-artifact@v4
        with:
          name: interoperability-agreement
          path: interoperability-agreement.json
