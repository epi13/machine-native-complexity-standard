name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - name: Validate JSON Schemas
        run: python -c "from mncs_validator.schemas import SCHEMA_NAMES, load_schema; [load_schema(n) for n in SCHEMA_NAMES]"
      - run: ./scripts/run-conformance-corpus
      - run: python scripts/run-mncds-corpus
      - run: ./scripts/run-interoperability --python-only
      - run: ./scripts/verify-examples
      - run: python -m build
      - run: git diff --check

  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: python -m pip install -e '.[dev]'
      - run: cargo fmt --manifest-path independent/rc-consumer/Cargo.toml -- --check
      - run: make release-candidate-check
      - run: git diff --check

  multilingual-wave-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: python -m pip install -e '.[dev]'
      - run: make multilingual-wave-one
      - run: mncs schema language-evidence-profile >/dev/null
      - run: mncs schema cross-language-comparison >/dev/null

  multilingual-wave-two:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v6.2.0
        with:
          go-version: "1.23.x"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: python -m pip install -e '.[dev]'
      - name: Verify schemas and Go provider corpus
        run: PYTHONPATH=src ./scripts/verify-wave-two
      - name: Go gateway unit, race, and fuzz checks
        run: make go-gateway
      - name: Native, generated-binding, process, and rollback checks
        run: make composed-gateway
      - name: Validate packaged schemas
        run: |
          mncs schema boundary-contract >/dev/null
          mncs schema composed-assurance-case >/dev/null
      - name: Check Wave Two tree cleanliness
        run: git diff --check -- case-studies/go-gateway case-studies/composed-gateway experimental/language-evidence docs/composed-systems.md rfcs/0007-composed-machine-native-systems.md

  multilingual-wave-three:
    name: Wave Three (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.23.x"
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: python -m pip install -e '.[dev]'
      - name: Run measured composed epoch
        run: make multilingual-wave-three WAVE_THREE_OUTPUT=evidence/cross-host-${RUNNER_OS}
      - name: Validate Wave Three packaged schema
        run: mncs schema composed-evidence-epoch >/dev/null
      - name: Check Wave Three tree cleanliness
        run: git diff --check -- case-studies/composed-gateway/wave-three schemas src tests scripts docs README.md Makefile
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: multilingual-wave-three-${{ runner.os }}
          path: case-studies/composed-gateway/wave-three/evidence/cross-host-${{ runner.os }}
          retention-days: 90

  multilingual-wave-four:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.23.x"
          cache: false
      - run: python -m pip install -e '.[dev]'
      - name: Verify custody, readiness, service, and fixture semantics
        run: make multilingual-wave-four WAVE_FOUR_OUTPUT=evidence/actual
      - name: Validate Wave Four packaged schemas
        run: |
          mncs schema evidence-custody >/dev/null
          mncs schema cross-host-agreement >/dev/null
          mncs schema claim-readiness >/dev/null
      - name: Check Wave Four tree cleanliness
        run: git diff --check -- case-studies/composed-gateway/wave-four schemas src tests scripts docs README.md Makefile
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: multilingual-wave-four-reference
          path: case-studies/composed-gateway/wave-four/evidence/actual
          retention-days: 90

  wave-four-cross-host-reconcile:
    needs: multilingual-wave-three
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v8
        with:
          pattern: multilingual-wave-three-*
          path: wave-three-hosts
      - name: Reconcile Ubuntu and macOS evidence
        shell: bash
        run: |
          mapfile -t records < <(find wave-three-hosts -type f -name wave-three-epoch.json -print | sort)
          test "${#records[@]}" -eq 2
          PYTHONPATH=src python case-studies/composed-gateway/wave-four/tools/reconcile_cross_host.py \
            "${records[@]}" \
            --output case-studies/composed-gateway/wave-four/evidence/cross-host-agreement.json
      - name: Validate cross-host agreement
        run: python -c "import json; from jsonschema import Draft202012Validator; s=json.load(open('schemas/mncs-cross-host-agreement.schema.json')); r=json.load(open('case-studies/composed-gateway/wave-four/evidence/cross-host-agreement.json')); assert not list(Draft202012Validator(s).iter_errors(r))"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: multilingual-wave-four-cross-host-agreement
          path: case-studies/composed-gateway/wave-four/evidence/cross-host-agreement.json
          retention-days: 90

  ravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - run: make ravel-test
      - run: make ravel-training-check
      - run: make ravel-unified-check
      - name: Upload unified mismatch evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ravel-unified-actual
          path: case-studies/ravel/unified-actual.json
          if-no-files-found: ignore

  dsense:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - run: make dsense-check

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: ./scripts/clean-wheel-smoke-test

  cross-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e '.[dev]'
      - name: Checkout pinned Rust validator
        env:
          RUST_COMMIT: ${{ vars.MNCS_RS_COMMIT }}
        run: |
          commit="${RUST_COMMIT:-$(cat interoperability/RUST_VALIDATOR_COMMIT)}"
          git clone https://github.com/epi13/mncs-validator-rs "$RUNNER_TEMP/mncs-validator-rs"
          git -C "$RUNNER_TEMP/mncs-validator-rs" checkout "$commit"
      - run: ./scripts/run-interoperability --rust-repository "$RUNNER_TEMP/mncs-validator-rs" --output interoperability-agreement.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: interoperability-agreement
          path: interoperability-agreement.json
