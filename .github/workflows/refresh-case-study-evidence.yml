name: Refresh Case Study Evidence

on:
  push:
    branches:
      - agent/fix-case-study-evidence

permissions:
  contents: write

concurrency:
  group: refresh-case-study-evidence
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-case-study-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Regenerate deterministic evidence
        run: |
          make remote-water-study
          make edgestream-water-integration
      - name: Commit refreshed evidence
        shell: bash
        run: |
          set -euo pipefail
          git add \
            case-studies/remote-water-control/evidence/results/scenario-results.json \
            case-studies/remote-water-control/evidence/results/study-summary.json \
            case-studies/edgestream-remote-water-integration/evidence/results/study-summary.json
          if git diff --cached --quiet; then
            echo "Evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh corrected case-study evidence"
          git push origin HEAD:agent/fix-case-study-evidence
