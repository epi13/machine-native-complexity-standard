name: Branch Lint Report

on:
  pull_request:
    paths:
      - "case-studies/remote-water-control/**"
      - "case-studies/edgestream-remote-water-integration/**"
      - ".github/workflows/branch-lint-report.yml"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Capture lint report
        shell: bash
        run: |
          set +e
          ruff check case-studies/remote-water-control case-studies/edgestream-remote-water-integration > ruff-report.txt 2>&1
          cat ruff-report.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-report-${{ github.sha }}
          path: ruff-report.txt
          if-no-files-found: error
          retention-days: 1
