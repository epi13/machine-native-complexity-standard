name: CacheForge Format Diagnostic

on:
  pull_request:
    paths:
      - "case-studies/cacheforge/**"
      - ".github/workflows/cacheforge-format-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: cacheforge-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply deterministic formatting fixes
        run: |
          ruff format case-studies/cacheforge
          ruff check --fix case-studies/cacheforge || true
          ruff check case-studies/cacheforge \
            > case-studies/cacheforge/ruff-lint-diagnostic.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cacheforge-formatted-source-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: case-studies/cacheforge/
