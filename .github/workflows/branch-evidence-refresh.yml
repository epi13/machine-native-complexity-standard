name: Branch Evidence Refresh

on:
  push:
    branches:
      - agent/strengthen-study-evidence

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - run: make remote-water-study
      - name: Commit regenerated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-studies/remote-water-control/evidence/results
          git commit -m "Refresh strengthened remote water evidence"
          git push origin HEAD:${{ github.ref_name }}
