name: Remote Water Control

on:
  push:
    branches: [main]
    paths:
      - "case-studies/remote-water-control/**"
      - "docs/remote-water-control.md"
      - "mkdocs.yml"
      - "Makefile"
      - ".github/workflows/remote-water-control.yml"
  pull_request:
    paths:
      - "case-studies/remote-water-control/**"
      - "docs/remote-water-control.md"
      - "mkdocs.yml"
      - "Makefile"
      - ".github/workflows/remote-water-control.yml"

permissions:
  contents: read

concurrency:
  group: remote-water-control-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8

jobs:
  development-study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Produce exact Ruff patch
        run: |
          ruff format case-studies/remote-water-control
          git diff --binary -- case-studies/remote-water-control > ruff-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: remote-water-ruff-format-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: ruff-format.patch
      - name: Check lint after formatting
        run: ruff check case-studies/remote-water-control
      - name: Run tests and controlled development study
        run: make remote-water-study
