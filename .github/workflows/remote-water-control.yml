name: Remote Water Control

on:
  push:
    branches: [main]
    paths:
      - "case-studies/remote-water-control/**"
      - "docs/remote-water-control.md"
      - "mkdocs.yml"
      - "Makefile"
      - ".github/workflows/remote-water-control.yml"
  pull_request:
    paths:
      - "case-studies/remote-water-control/**"
      - "docs/remote-water-control.md"
      - "mkdocs.yml"
      - "Makefile"
      - ".github/workflows/remote-water-control.yml"

permissions:
  contents: read

concurrency:
  group: remote-water-control-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  LC_ALL: C.UTF-8

jobs:
  development-study:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Check case-study source
        run: |
          ruff format --check case-studies/remote-water-control
          ruff check case-studies/remote-water-control
      - name: Run tests and controlled development study
        run: make remote-water-study
      - name: Verify regenerated evidence
        run: |
          git diff --check -- case-studies/remote-water-control
          git diff --exit-code -- case-studies/remote-water-control/evidence/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-water-evidence-${{ matrix.python-version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: case-studies/remote-water-control/evidence/results/
