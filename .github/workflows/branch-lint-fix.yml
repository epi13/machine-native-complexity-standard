name: Branch Lint Fix

on:
  push:
    branches:
      - agent/strengthen-study-evidence

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check --fix case-studies/remote-water-control case-studies/edgestream-remote-water-integration
      - run: ruff format case-studies/remote-water-control case-studies/edgestream-remote-water-integration
      - name: Commit lint fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-studies/remote-water-control case-studies/edgestream-remote-water-integration
          git commit -m "Apply lint fixes to strengthened studies"
          git push origin HEAD:${{ github.ref_name }}
