# Non-normative project development control plane for the separate MNCS Forge repository.
version = 1
environment_allowlist = [
  "PATH", "LANG", "LC_ALL", "CC", "CFLAGS", "RUSTFLAGS", "CARGO_HOME", "RUSTUP_HOME"
]
required_capabilities = []

[project]
name = "MNCS provider-neutral development control plane"
identity = "mncs-forge-development-v2"
root = "."

[paths]
candidates = ["case-studies/edgestream/machine"]
generated = ["case-studies/edgestream/build"]
contracts = ["case-studies/edgestream/specification"]
references = ["case-studies/edgestream/reference"]
evaluators = ["case-studies/edgestream/tools/study_evaluation.py", "case-studies/edgestream/tools/harness_regression.py"]
acceptance_policies = ["case-studies/edgestream/preregistration.json"]
development_evidence = ["case-studies/edgestream/evidence", "case-studies/edgestream/mncds"]
protected = []
outputs = [".mncs-forge/outputs"]

[limits]
timeout_seconds = 3600
output_bytes = 1048576

[commands]
mncs = [".venv/bin/mncs"]
mncds = [".venv/bin/mncds"]

[authority.development]
may_write_candidates = true
may_write_generated = true
may_run_providers = true

[authority.evaluator]
candidate_read_only = true
authority_read_only = true
require_frozen_identities = true
withhold_repair_feedback = true

[policies]
selection = "case-studies/edgestream/preregistration.json"
useful_benefit_objective = "case-studies/edgestream/preregistration.json"

[[workflows]]
name = "tooling-inspect"
category = "inspection"
mode = "development"
command = [".venv/bin/python", "scripts/forge_workflow.py", "tooling-inspect"]
provider_protocol = false
subject = "project"
disclosure = "compact"

[[workflows]]
name = "release-candidate-check"
category = "evidence_derivation"
mode = "development"
command = [".venv/bin/python", "scripts/forge_workflow.py", "release-candidate-check"]
provider_protocol = false
subject = "project"
disclosure = "compact"

[[workflows]]
name = "release-candidate-corpus"
category = "evidence_derivation"
mode = "development"
command = [".venv/bin/python", "scripts/forge_workflow.py", "release-candidate-corpus"]
provider_protocol = false
subject = "project"
disclosure = "compact"

[[workflows]]
name = "python-rust-comparison"
category = "evidence_derivation"
mode = "development"
command = [".venv/bin/python", "scripts/forge_workflow.py", "python-rust-comparison"]
provider_protocol = false
subject = "project"
disclosure = "compact"

[[workflows]]
name = "recursive-analyzer-study"
category = "evidence_derivation"
mode = "development"
command = [".venv/bin/python", "scripts/forge_workflow.py", "recursive-analyzer-study"]
provider_protocol = false
subject = "project"
disclosure = "compact"

[[workflows]]
name = "core-check"
category = "build"
mode = "development"
command = [".venv/bin/python", "scripts/forge_workflow.py", "core-check"]
provider_protocol = false
subject = "project"
disclosure = "compact"

[[workflows]]
name = "ravel-0.4-check"
category = "inspection"
mode = "development"
command = [".venv/bin/python", "scripts/forge_workflow.py", "ravel-0.4-check"]
provider_protocol = false
subject = "project"
disclosure = "compact"

[[workflows]]
name = "edgestream-read-only-inspect"
category = "inspection"
mode = "development"
command = ["python3", "-c", "import json; from pathlib import Path; required=['case-studies/edgestream/specification/contract.md','case-studies/edgestream/reference/edgestream_reference.c','case-studies/edgestream/machine/edgestream_generated.c','case-studies/edgestream/preregistration.json','case-studies/edgestream/mncds/development-record.json','case-studies/edgestream/evidence/results/study-summary.json']; missing=[p for p in required if not Path(p).is_file()]; print(json.dumps({'status':'PASS' if not missing else 'UNKNOWN','witnesses':[{'visible_file':p} for p in required if p not in missing],'limitations':['path visibility is not proof of evidence validity, independence, or protected custody']+[f'missing required example path: {p}' for p in missing],'unsupported_constructs':['independent evaluation','protected holdout','witnessed evidence','governance approval']},sort_keys=True))"]
provider_protocol = false
disclosure = "compact"

[[workflows]]
name = "edgestream-smoke"
category = "differential_behavior"
mode = "development"
command = ["python", "case-studies/edgestream/tools/smoke.py"]
provider_protocol = false
disclosure = "compact"

[[workflows]]
name = "edgestream-mncs-validate"
category = "mncs_bundle_validation"
mode = "both"
command = [".venv/bin/mncs", "validate-bundle", "case-studies/edgestream", "--json"]
provider_protocol = false
disclosure = "status-only"

[[workflows]]
name = "edgestream-mncds-validate"
category = "mncds_record_validation"
mode = "both"
command = [".venv/bin/mncds", "validate", "case-studies/edgestream/mncds/development-record.json", "--json"]
provider_protocol = false
disclosure = "status-only"
